name: Publish product website

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: product-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static product website
        run: |
          mkdir "$RUNNER_TEMP/snapnote-pages"
          cp index.html styles.css app.js .nojekyll "$RUNNER_TEMP/snapnote-pages/"
          cp -R assets downloads "$RUNNER_TEMP/snapnote-pages/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/snapnote-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
